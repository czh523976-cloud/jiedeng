<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>黑姬结灯 - 生日回忆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js & Tween.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background-color: #fafaf9; /* stone-50 */
        }
        .font-handwriting {
            font-family: 'Ma Shan Zheng', cursive;
        }
        /* Hide scrollbar */
        .no-scroll { overflow: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-fade-in-slow { animation: fade-in 1.2s ease-out forwards; }
        @keyframes fade-in-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fade-in-up 0.8s ease-out forwards; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        /* Card Pattern Background */
        .bg-pattern {
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
        }

        #particle-cake-container {
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #111827, #374151); /* dark theme for particles */
            position: relative;
            overflow: hidden;
        }

        /* Music Button Spin Animation */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 4s linear infinite;
        }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Icons ---
        const Icons = {
            Heart: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            X: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M18 6 6 18"/><path d="m6 6 18 18"/></svg>,
            ChevronLeft: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m9 18 6-6-6-6"/></svg>,
            Sparkles: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M2 7h4"/><path d="M13 21h8"/><path d="M17 17v8"/></svg>,
            Music: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>,
            Play: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Pause: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="4" height="16" x="6" y="4"/><rect width="4" height="16" x="14" y="4"/></svg>,
            Camera: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Stamp: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M5 22h14"/><path d="M19.27 13.73A2.66 2.66 0 0 0 21 10.98c0-1.8-1.55-3.27-3.41-3.27-1.12 0-1.67.63-2.12 1.34.45-.71 1-1.34 2.12-1.34 1.86 0 3.41 1.47 3.41 3.27 0 1.09-.65 2.06-1.73 2.75"/><path d="M4.73 13.73A2.66 2.66 0 0 1 3 10.98C3 9.18 4.55 7.71 6.41 7.71c1.12 0 1.67.63 2.12 1.34-.45-.71-1-1.34-2.12-1.34-1.86 0-3.41 1.47-3.41 3.27 0 1.09.65 2.06 1.73 2.75"/><path d="M12 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 22v-2"/><path d="m17 7-1.4 1.4"/><path d="m7 7 1.4 1.4"/></svg>,
            Cake: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v2"/><path d="M12 8v2"/><path d="M17 8v2"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>,
            Film: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        };

        // --- Gallery Data ---
        // UPDATED: Added "public/" prefix to all image paths
        const galleryImages = [
            { src: "public/1765514468415.jpeg", title: "第一次相遇", desc: "命运的起始。", tags: ["日常", "温暖"] },
            { src: "public/1765514594051.jpeg", title: "秋色染红的季节", desc: "回眸瞬间，仿佛整个秋天都静止了。", tags: ["秋季", "校服"] },
            { src: "public/1765514402688.jpeg", title: "祭典之夜的牵手", desc: "灯火阑珊处，紧紧握住的手不想放开。", tags: ["祭典", "夜晚"] },
            { src: "public/1765514343669.jpeg", title: "喧嚣中的宁静", desc: "即使身处热闹的人群，眼中也只有彼此。", tags: ["浴衣", "回忆"] },
            { src: "public/1765514425323.jpeg", title: "家常的温馨", desc: "厨房里的烟火气，是最平凡也是最珍贵的幸福。", tags: ["居家", "料理"] },
            { src: "public/1765514304900.jpeg", title: "静谧的晨光", desc: "阳光洒在身上，慵懒而惬意。", tags: ["早晨", "私语"] },
            { src: "public/1765514479451.jpeg", title: "吓人的玲", desc: "突如其来的瞬间，心跳漏了一拍。", tags: ["心动", "瞬间"] },
            { src: "public/789.png", title: "素描下的哈气", desc: "一笔一画，勾勒出心中最傲娇的样子。", tags: ["艺术", "素描"] },
            { src: "public/1765514441648.jpeg", title: "永恒的羁绊", desc: "无论时光流转，我们永远在一起。", tags: ["合影", "团圆"] }
        ];

        // --- Q-Version Card Data ---
        // UPDATED: Added "public/" prefix to all image paths
        const qVersionImages = [
            { src: "public/111.jpg", title: "喂食时刻", desc: "好吃的！眼睛都发光啦✨", rotate: -3 },
            { src: "public/333.jpg", title: "元气满满", desc: "今天也要加油鸭！", rotate: 2 },
            { src: "public/222.jpg", title: "午睡时间", desc: "呼噜呼噜...Zzz...", rotate: -2 },
            { src: "public/666.jpg", title: "生气啦", desc: "哼！不理你了！(傲娇)", rotate: 4 },
            { src: "public/777.png", title: "哈！", desc: "哈！", rotate: -1 },
            { src: "public/999.jpg", title: "梳妆打扮", desc: "最温柔的时刻。", rotate: 3 },
            { src: "public/888.jpg", title: "甜蜜幻想", desc: "脑海里全是你...", rotate: -4 }
        ];

        // --- Music Player Component ---
        const BackgroundMusic = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [showTip, setShowTip] = useState(true);
            const audioRef = useRef(null);

            useEffect(() => {
                // Attempt autoplay
                const audio = audioRef.current;
                if (audio) {
                    audio.volume = 0.5; 
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            setIsPlaying(true);
                            setShowTip(false);
                        }).catch(error => {
                            console.log("Autoplay prevented by browser.");
                        });
                    }
                }
                
                // Hide tip after 15 seconds
                const timer = setTimeout(() => setShowTip(false), 15000);
                return () => clearTimeout(timer);
            }, []);

            const togglePlay = () => {
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsPlaying(!isPlaying);
                setShowTip(false);
            };

            return (
                <div className="fixed bottom-6 left-6 z-50 flex items-center gap-4 pointer-events-none">
                    {/* UPDATED: Added "public/" prefix to music path */}
                    <audio ref={audioRef} src="public/BGM.mp3" loop />
                    <button 
                        onClick={togglePlay}
                        className={`pointer-events-auto w-12 h-12 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-md shadow-lg border border-rose-100 text-rose-500 hover:scale-110 transition-transform duration-300 ${isPlaying ? 'animate-spin-slow' : ''}`}
                        title={isPlaying ? "Pause Music" : "Play Music"}
                    >
                        {isPlaying ? <Icons.Music className="w-6 h-6" /> : <Icons.Play className="w-6 h-6 ml-1" />}
                    </button>

                    {/* Tooltip */}
                    {showTip && !isPlaying && (
                        <div className="pointer-events-auto animate-bounce bg-white/90 backdrop-blur-md px-4 py-2 rounded-xl shadow-xl border border-rose-200 text-rose-500 text-sm font-bold tracking-wide relative">
                            <span className="relative z-10">👈 点此播放 BGM ♪</span>
                            <div className="absolute left-[-6px] top-1/2 -translate-y-1/2 w-3 h-3 bg-white border-b border-l border-rose-200 transform rotate-45"></div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 3D Particle Cake Component ---
        const ParticleCake3D = () => {
            const containerRef = useRef(null);
            const [isExploded, setIsExploded] = useState(false);
            const particlesRef = useRef(null);
            const plateRef = useRef(null);
            const flameParticlesRef = useRef([]); // Refs for animating flames
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current) return;

                // 1. Setup
                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x111827, 0.003); // Match background
                sceneRef.current = scene;

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 60, 200);
                camera.lookAt(0, 0, 0);
                cameraRef.current = camera;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                containerRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // 2. Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);
                const spotLight = new THREE.SpotLight(0xffd700, 1.8);
                spotLight.position.set(50, 150, 50);
                spotLight.angle = Math.PI / 4;
                scene.add(spotLight);
                
                // 3. Particles - The Cake
                const particleGroup = new THREE.Group();
                
                const canvas = document.createElement('canvas');
                canvas.width = 32; canvas.height = 32;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.arc(16, 16, 10, 0, 2 * Math.PI);
                ctx.fillStyle = 'white';
                ctx.fill();
                const particleTexture = new THREE.CanvasTexture(canvas);

                const materialBase = new THREE.SpriteMaterial({ map: particleTexture, color: 0xffffff });

                const createParticle = (x, y, z, color, scale = 1.5, type = 'cake') => {
                    const mat = materialBase.clone();
                    mat.color.setHex(color);
                    const sprite = new THREE.Sprite(mat);
                    sprite.position.set(x, y, z);
                    sprite.scale.set(scale, scale, scale);
                    
                    const ex = (Math.random() - 0.5) * 450;
                    const ey = (Math.random() - 0.5) * 450 + 50;
                    const ez = (Math.random() - 0.5) * 450;

                    sprite.userData = {
                        cakePos: { x, y, z },
                        explodePos: { x: ex, y: ey, z: ez },
                        type: type,
                        speed: Math.random() * 0.05
                    };
                    return sprite;
                };

                const addLayer = (yBase, height, radius, color, density) => {
                    for(let i=0; i<density; i++) {
                        const r = Math.sqrt(Math.random()) * radius;
                        const theta = Math.random() * 2 * Math.PI;
                        const x = r * Math.cos(theta);
                        const y = yBase + Math.random() * height;
                        const z = r * Math.sin(theta);
                        
                        let pColor = color;
                        let scale = 1.5;
                        if (Math.random() < 0.05) {
                            const sprinkles = [0xff69b4, 0x00bfff, 0xffff00, 0x32cd32];
                            pColor = sprinkles[Math.floor(Math.random() * sprinkles.length)];
                            scale = 1.2;
                        }

                        const p = createParticle(x, y, z, pColor, scale);
                        particleGroup.add(p);
                    }
                };

                const addStrawberries = (y, radius, count) => {
                    for(let i=0; i<count; i++) {
                        const theta = (i / count) * 2 * Math.PI;
                        const x = radius * Math.cos(theta);
                        const z = radius * Math.sin(theta);
                        
                        for(let j=0; j<5; j++) {
                            const p = createParticle(x + (Math.random()-0.5)*2, y + (Math.random()-0.5)*2 + 2, z + (Math.random()-0.5)*2, 0xff0000, 2.5, 'fruit');
                            particleGroup.add(p);
                        }
                        const pLeaf = createParticle(x, y + 4, z, 0x00ff00, 1.5, 'fruit');
                        particleGroup.add(pLeaf);
                    }
                };

                const addCandles = (positions) => {
                    positions.forEach(pos => {
                        for(let h=0; h<12; h++) {
                            const color = h % 3 === 0 ? 0xff69b4 : 0xffffff;
                            const p = createParticle(pos.x, pos.y + h, pos.z, color, 1.8, 'candle');
                            particleGroup.add(p);
                        }
                        const flame = createParticle(pos.x, pos.y + 14, pos.z, 0xffa500, 3.5, 'flame');
                        flameParticlesRef.current.push(flame);
                        particleGroup.add(flame);
                        
                        const flameCore = createParticle(pos.x, pos.y + 13.5, pos.z, 0xffff00, 2.0, 'flame');
                        flameParticlesRef.current.push(flameCore);
                        particleGroup.add(flameCore);
                    });
                };

                addLayer(-30, 25, 50, 0xfdf5e6, 1800);
                addStrawberries(-5, 45, 12); 

                addLayer(-5, 20, 35, 0xffb7c5, 1200);
                addStrawberries(15, 30, 8); 

                addLayer(15, 15, 25, 0x5d4037, 1000);
                addStrawberries(30, 20, 6); 

                addCandles([
                    {x: -12, y: 30, z: 8},
                    {x: 12, y: 30, z: 8},
                    {x: 0, y: 30, z: -12}
                ]);

                scene.add(particleGroup);
                particlesRef.current = particleGroup;

                // 4. The Chocolate Plate
                const textCanvas = document.createElement('canvas');
                textCanvas.width = 512;
                textCanvas.height = 128;
                const tCtx = textCanvas.getContext('2d');
                
                tCtx.fillStyle = '#3e2723';
                tCtx.beginPath();
                tCtx.roundRect(10, 10, 492, 108, 20);
                tCtx.fill();
                tCtx.strokeStyle = '#d7ccc8';
                tCtx.lineWidth = 5;
                tCtx.stroke();

                tCtx.fillStyle = '#ffffff';
                tCtx.font = 'bold 36px "Noto Sans SC", sans-serif';
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                tCtx.fillText("结灯生日快乐（非短发版）", 256, 64);

                const plateTex = new THREE.CanvasTexture(textCanvas);
                const plateGeo = new THREE.PlaneGeometry(60, 15);
                const plateMat = new THREE.MeshBasicMaterial({ map: plateTex, side: THREE.DoubleSide, transparent: true });
                const plateMesh = new THREE.Mesh(plateGeo, plateMat);
                
                plateMesh.position.set(0, 45, 15); 
                plateMesh.rotation.x = -0.1;
                
                plateMesh.userData = {
                    cakePos: { x: 0, y: 45, z: 15, rotX: -0.1, rotY: 0, rotZ: 0 },
                    explodePos: { x: 0, y: 80, z: 20, rotX: Math.PI/4, rotY: Math.PI, rotZ: Math.PI/8 }
                };

                scene.add(plateMesh);
                plateRef.current = plateMesh;

                const onPointerClick = (event) => {
                    toggleExplosion();
                };
                containerRef.current.addEventListener('click', onPointerClick);

                const animate = (time) => {
                    requestAnimationFrame(animate);
                    TWEEN.update(time);
                    
                    flameParticlesRef.current.forEach(flame => {
                        if (!isExploded.current) {
                            const scale = 3 + Math.sin(time * 0.01 + flame.uuid) * 0.5;
                            flame.scale.set(scale, scale, scale);
                            flame.material.opacity = 0.8 + Math.sin(time * 0.02) * 0.2;
                        }
                    });

                    if (!isExploded.current) {
                       particleGroup.rotation.y += 0.002;
                    } else {
                       particleGroup.rotation.y += 0.0005;
                    }
                    
                    renderer.render(scene, camera);
                };
                
                particleGroup.add(plateMesh);
                animate();

                const handleResize = () => {
                    if (!cameraRef.current || !rendererRef.current) return;
                    cameraRef.current.aspect = window.innerWidth / window.innerHeight;
                    cameraRef.current.updateProjectionMatrix();
                    rendererRef.current.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    containerRef.current.removeEventListener('click', onPointerClick);
                    containerRef.current.removeChild(rendererRef.current.domElement);
                };
            }, []);

            const toggleExplosion = () => {
                const group = particlesRef.current;
                const plate = plateRef.current;
                if (!group || !plate) return;

                setIsExploded(prev => {
                    const targetState = !prev;
                    group.children.forEach(child => {
                        if (child.isMesh && child !== plate) return;
                        if (child === plate) return;

                        const target = targetState ? child.userData.explodePos : child.userData.cakePos;
                        const delay = Math.random() * 500;
                        
                        new TWEEN.Tween(child.position)
                            .to(target, 1500)
                            .delay(delay)
                            .easing(targetState ? TWEEN.Easing.Exponential.Out : TWEEN.Easing.Elastic.Out)
                            .start();
                    });

                    const pTargetPos = targetState ? plate.userData.explodePos : plate.userData.cakePos;
                    
                    new TWEEN.Tween(plate.position)
                        .to(pTargetPos, 1500)
                        .easing(targetState ? TWEEN.Easing.Cubic.Out : TWEEN.Easing.Bounce.Out)
                        .start();
                        
                    new TWEEN.Tween(plate.rotation)
                        .to({ x: pTargetPos.rotX, y: pTargetPos.rotY, z: pTargetPos.rotZ }, 1500)
                        .start();

                    return targetState;
                });
            };

            return (
                <div id="particle-cake-container" ref={containerRef}>
                    <div className="absolute top-10 w-full text-center pointer-events-none z-10 select-none">
                        <div className="inline-flex items-center gap-2 px-4 py-2 bg-white/10 backdrop-blur rounded-full text-amber-200 border border-amber-500/30 shadow-lg">
                            <Icons.Cake className="w-5 h-5" />
                            <span className="text-sm font-bold tracking-widest">FINAL SURPRISE</span>
                        </div>
                        <h2 className="mt-4 text-4xl md:text-5xl font-bold text-white drop-shadow-lg tracking-wide">
                            星尘蛋糕
                        </h2>
                        <p className="mt-2 text-stone-400 text-sm">点击蛋糕，释放许愿星尘</p>
                    </div>
                </div>
            );
        };

        // --- Q-Card Section Component ---
        const QCardSection = ({ onImageClick }) => {
            return (
                <div id="q-card" className="py-24 bg-stone-100 relative overflow-hidden">
                    <div className="absolute inset-0 bg-pattern opacity-30 pointer-events-none"></div>
                    
                    <div className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="text-center mb-12">
                            <div className="inline-block p-2 px-4 bg-rose-100 text-rose-600 rounded-full text-sm font-bold tracking-wide mb-3">
                                Q-VERSION DIARY
                            </div>
                            <h2 className="text-4xl font-bold text-stone-800 font-handwriting">结灯的Q版生活手账</h2>
                            <p className="text-stone-500 mt-2">可可爱爱的每一天 (点击小图放大)</p>
                        </div>

                        <div className="bg-white rounded-[2rem] shadow-2xl p-8 md:p-12 transform transition-all hover:scale-[1.01] duration-500 border-8 border-white ring-1 ring-stone-200 relative">
                            <div className="absolute top-0 left-0 w-full h-8 bg-rose-200/30"></div>
                            <div className="absolute -top-3 -right-3 text-rose-400 transform rotate-12">
                                <Icons.Heart className="w-12 h-12 fill-rose-300" />
                            </div>
                            <div className="absolute -bottom-4 -left-2 text-yellow-400 transform -rotate-12">
                                <Icons.Sparkles className="w-10 h-10" />
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-10">
                                {qVersionImages.map((img, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => onImageClick(img)}
                                        className="group relative cursor-pointer"
                                        style={{ transform: `rotate(${img.rotate}deg)` }}
                                    >
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-16 h-4 bg-yellow-100/80 shadow-sm z-20 transform -rotate-2"></div>
                                        <div className="bg-white p-3 pb-8 shadow-md group-hover:shadow-2xl group-hover:scale-110 group-hover:rotate-0 transition-all duration-300 rounded-sm border border-stone-100">
                                            <div className="aspect-square overflow-hidden rounded-sm bg-stone-50 mb-2">
                                                <img src={img.src} alt={img.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy"/>
                                            </div>
                                            <div className="absolute bottom-2 left-0 right-0 text-center font-handwriting text-stone-600 text-lg">
                                                {img.title}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                <div className="hidden md:flex items-center justify-center p-6 transform rotate-3">
                                    <div className="bg-yellow-50 p-6 rounded shadow-md w-full h-full flex flex-col items-center justify-center text-center border-l-4 border-yellow-200">
                                        <p className="font-handwriting text-xl text-stone-600 leading-relaxed">
                                            "不管是生气的样子，<br/>还是开心的样子，<br/>都是最真实的你！"
                                        </p>
                                        <Icons.Stamp className="w-8 h-8 text-rose-300 mt-4 opacity-50"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Video Section Component ---
        const VideoSection = () => {
            return (
                <div id="video-end" className="py-24 bg-stone-50 relative border-t border-stone-100">
                    <div className="max-w-5xl mx-auto px-4 text-center">
                        <div className="mb-10">
                            <h2 className="text-4xl font-bold text-stone-800 font-handwriting mb-4">故事结束啦？</h2>
                            <div className="w-24 h-1 bg-rose-400 mx-auto rounded-full"></div>
                        </div>
                        
                        <div className="rounded-2xl overflow-hidden shadow-2xl ring-4 ring-white ring-offset-4 ring-offset-stone-100 bg-black relative aspect-video">
                            {/* UPDATED: Added "public/" prefix to video path */}
                            <video src="public/hjd.mp4" controls className="w-full h-full object-cover" loading="lazy">
                                <p className="text-white">Your browser does not support the video tag.</p>
                            </video>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [selectedImageIndex, setSelectedImageIndex] = useState(null);
            const [selectedQImage, setSelectedQImage] = useState(null); // For Q-Card modal
            const [isScrolled, setIsScrolled] = useState(false);
            const [showWelcome, setShowWelcome] = useState(true);
            const [isPaused, setIsPaused] = useState(false);
            const scrollContainerRef = useRef(null);
            
            // Double gallery for loop
            const doubledImages = [...galleryImages, ...galleryImages];

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                if (showWelcome) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = 'unset';
                return () => window.removeEventListener('scroll', handleScroll);
            }, [showWelcome]);

            // Auto-scroll logic
            useEffect(() => {
                const scrollContainer = scrollContainerRef.current;
                if (!scrollContainer) return;
                let animationFrameId;
                const scroll = () => {
                    if (!isPaused) {
                        if (scrollContainer.scrollLeft >= (scrollContainer.scrollWidth / 2)) {
                             scrollContainer.scrollLeft -= (scrollContainer.scrollWidth / 2);
                        } else {
                             scrollContainer.scrollLeft += 0.8;
                        }
                    }
                    animationFrameId = requestAnimationFrame(scroll);
                };
                animationFrameId = requestAnimationFrame(scroll);
                return () => cancelAnimationFrame(animationFrameId);
            }, [isPaused]);

            const openModal = (index) => {
                setSelectedImageIndex(index);
                document.body.style.overflow = 'hidden';
                setIsPaused(true);
            };
            const closeModal = () => {
                setSelectedImageIndex(null);
                setSelectedQImage(null);
                document.body.style.overflow = 'unset';
                setIsPaused(false);
            };
            const scrollGallery = (direction) => {
                if (scrollContainerRef.current) {
                    const amount = direction === 'left' ? -400 : 400;
                    scrollContainerRef.current.scrollBy({ left: amount, behavior: 'smooth' });
                }
            };
            const nextImage = (e) => {
                if(e) e.stopPropagation();
                setSelectedImageIndex((prev) => (prev + 1) % galleryImages.length);
            };
            const prevImage = (e) => {
                if(e) e.stopPropagation();
                setSelectedImageIndex((prev) => (prev - 1 + galleryImages.length) % galleryImages.length);
            };

            return (
                <div className="min-h-screen font-sans">
                    
                    {/* Background Music */}
                    <BackgroundMusic />

                    {/* Welcome Modal */}
                    {showWelcome && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fade-in" onClick={() => setShowWelcome(false)}>
                            <div className="relative bg-white p-2 rounded-2xl shadow-2xl max-w-md w-full animate-fade-in-up" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setShowWelcome(false)} className="absolute -top-4 -right-4 bg-rose-500 text-white p-2 rounded-full shadow-lg z-10"><Icons.X className="w-5 h-5"/></button>
                                <div className="rounded-xl overflow-hidden relative">
                                    {/* UPDATED: Added "public/" prefix to welcome image path */}
                                    <img src="public/1764957880189.jpg" alt="Welcome" className="w-full h-auto object-cover"/>
                                    <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-rose-900/80 p-6 pt-12 text-center text-white">
                                        <p className="text-lg font-bold">欢迎来到结灯的生日庆典</p>
                                        <p className="text-xs text-rose-200 mt-1">Tap to Start</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Nav */}
                    <nav className={`fixed top-0 inset-x-0 z-40 transition-all ${isScrolled ? 'bg-white/80 backdrop-blur shadow-sm py-4' : 'bg-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-2 text-rose-950 font-bold tracking-wider text-xl">
                                <Icons.Sparkles className="w-6 h-6 text-rose-500" />
                                <span>YUI MEMORIES</span>
                            </div>
                            <div className="hidden md:flex gap-6 text-sm font-medium text-stone-600">
                                <button onClick={() => document.getElementById('gallery').scrollIntoView({behavior:'smooth'})} className="hover:text-rose-500">记忆回廊</button>
                                <button onClick={() => document.getElementById('q-card').scrollIntoView({behavior:'smooth'})} className="hover:text-rose-500">Q版手账</button>
                                <button onClick={() => document.getElementById('particle-cake-container').scrollIntoView({behavior:'smooth'})} className="hover:text-rose-500">星尘蛋糕</button>
                                <span className="bg-rose-500 text-white px-4 py-1 rounded-full shadow-lg shadow-rose-200">Happy Birthday</span>
                            </div>
                        </div>
                    </nav>

                    {/* Header */}
                    {/* UPDATED: Added "public/" prefix to background image path */}
                    <header className="relative h-[80vh] flex items-center justify-center overflow-hidden bg-cover bg-center" style={{backgroundImage: "url('public/9090.jpg')"}}>
                        <div className="absolute inset-0 z-0 bg-black/40 backdrop-blur-[2px]"></div>
                        <div className="relative z-10 text-center px-4 text-white">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-100/50 border border-rose-200 text-white text-sm mb-6 animate-fade-in-up">
                                <Icons.Heart className="w-3 h-3 fill-rose-500"/> <span>Celebrating Kurohime Yui</span>
                            </div>
                            <h1 className="text-5xl md:text-7xl font-bold text-white mb-6 animate-fade-in-slow">黑姬结灯<br/><span className="text-rose-500">生日快乐</span></h1>
                            <p className="text-lg text-white max-w-xl mx-auto mb-10 animate-fade-in-up" style={{animationDelay:'0.2s'}}>收集时光的碎片，拼凑出最珍贵的回忆。</p>
                            <button onClick={() => document.getElementById('gallery').scrollIntoView({behavior:'smooth'})} className="px-8 py-4 bg-stone-900 text-white rounded-full shadow-xl hover:scale-105 transition-transform flex items-center gap-2 mx-auto animate-fade-in-up" style={{animationDelay:'0.4s'}}>
                                <Icons.Camera className="w-5 h-5"/> 进入回忆回廊
                            </button>
                        </div>
                    </header>

                    {/* Gallery Section */}
                    <section id="gallery" className="py-24 bg-white relative">
                        <div className="max-w-7xl mx-auto px-4 mb-8 flex justify-between items-end">
                            <div>
                                <h2 className="text-3xl font-bold flex gap-3 items-center">记忆回廊 <span className="text-sm font-normal text-stone-400 bg-stone-100 px-2 rounded">Gallery</span></h2>
                                <p className="text-stone-500 mt-2">滑动查看每一个珍藏的瞬间</p>
                            </div>
                            <div className="hidden md:flex gap-2">
                                <button onClick={() => scrollGallery('left')} className="p-2 rounded-full border hover:bg-rose-50 hover:text-rose-500 transition-colors"><Icons.ChevronLeft/></button>
                                <button onClick={() => scrollGallery('right')} className="p-2 rounded-full border hover:bg-rose-50 hover:text-rose-500 transition-colors"><Icons.ChevronRight/></button>
                            </div>
                        </div>
                        
                        <div ref={scrollContainerRef} className="flex overflow-x-auto gap-4 md:gap-8 px-4 md:px-[calc(50%-150px)] pb-12 pt-4 scrollbar-hide"
                            onMouseEnter={() => setIsPaused(true)} onMouseLeave={() => setIsPaused(false)}
                            onTouchStart={() => setIsPaused(true)} onTouchEnd={() => setIsPaused(false)}>
                            {doubledImages.map((img, i) => (
                                <div key={`${i}-${img.src}`} className="relative flex-shrink-0 w-[85vw] md:w-[600px] group cursor-pointer" onClick={() => openModal(i % galleryImages.length)}>
                                    <div className="relative rounded-2xl overflow-hidden shadow-md group-hover:shadow-2xl transition-all duration-500 group-hover:-translate-y-2 bg-stone-100 aspect-[3/4] md:aspect-[4/3]">
                                        <img src={img.src} alt={img.title} className="w-full h-full object-cover" loading="lazy"/>
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-80 md:opacity-0 md:group-hover:opacity-100 transition-opacity flex flex-col justify-end p-6">
                                            <p className="text-rose-300 text-xs font-bold uppercase mb-1">{img.tags.join(' · ')}</p>
                                            <h3 className="text-white text-xl font-bold">{img.title}</h3>
                                            <p className="text-stone-200 text-sm line-clamp-1">{img.desc}</p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Q-Version Card Section */}
                    <QCardSection onImageClick={setSelectedQImage} />

                    {/* 3D Particle Cake Section */}
                    <ParticleCake3D />

                    {/* Video Finale Section */}
                    <VideoSection />

                    {/* Footer */}
                    <footer className="bg-stone-900 text-stone-400 py-16 px-4 text-center">
                         <Icons.Music className="w-8 h-8 text-rose-500 mx-auto mb-6 animate-float"/>
                         <p className="text-xl italic text-stone-200 mb-8 font-serif">"愿未来的每一个日子里，你依然被爱意包围。"</p>
                         
                         <div className="border-t border-stone-800 pt-8 flex flex-col items-center gap-6">
                             <p className="text-stone-500 text-sm">© 2026 Kurohime Yui Birthday Celebration.</p>
                             
                             <div className="flex flex-col gap-2">
                                <div className="px-6 py-2 rounded-full bg-stone-800/50 border border-rose-900/30">
                                    <span className="text-rose-400 font-bold text-sm tracking-widest mr-2">制作人</span>
                                    <span className="text-stone-300 font-medium text-base">柴三岁（屑屑屑）</span>
                                </div>
                                <div className="px-6 py-2 rounded-full bg-stone-800/50 border border-rose-900/30">
                                    <span className="text-rose-400 font-bold text-sm tracking-widest mr-2">婚纱CG制作者</span>
                                    <span className="text-stone-300 font-medium text-base">梦里（黑姬结灯人柱力）</span>
                                </div>
                             </div>
                         </div>
                    </footer>

                    {/* Lightbox for Gallery */}
                    {selectedImageIndex !== null && (
                        <div className="fixed inset-0 z-[70] bg-black/95 backdrop-blur flex items-center justify-center p-4 animate-fade-in" onClick={closeModal}>
                            <button onClick={closeModal} className="absolute top-6 right-6 text-white/50 hover:text-white p-2"><Icons.X className="w-8 h-8"/></button>
                            <div className="relative w-full max-w-6xl h-full flex flex-col md:flex-row items-center gap-8" onClick={e=>e.stopPropagation()}>
                                <button onClick={prevImage} className="absolute left-2 md:-left-16 text-white bg-white/10 p-3 rounded-full hover:bg-white/20"><Icons.ChevronLeft/></button>
                                <div className="flex-1 flex items-center justify-center h-[70vh] w-full">
                                    <img src={galleryImages[selectedImageIndex].src} className="max-w-full max-h-full object-contain shadow-2xl rounded"/>
                                </div>
                                <div className="md:w-80 w-full bg-stone-900/50 backdrop-blur p-6 rounded-xl border border-white/10 text-white shrink-0 absolute bottom-4 md:static">
                                    <h3 className="text-2xl font-bold mb-2">{galleryImages[selectedImageIndex].title}</h3>
                                    <p className="text-stone-300 text-sm">{galleryImages[selectedImageIndex].desc}</p>
                                </div>
                                <button onClick={nextImage} className="absolute right-2 md:-right-16 text-white bg-white/10 p-3 rounded-full hover:bg-white/20"><Icons.ChevronRight/></button>
                            </div>
                        </div>
                    )}

                    {/* Lightbox for Q-Card */}
                    {selectedQImage && (
                        <div className="fixed inset-0 z-[80] bg-black/90 backdrop-blur flex items-center justify-center p-4 animate-fade-in" onClick={closeModal}>
                            <button onClick={closeModal} className="absolute top-6 right-6 text-white/50 hover:text-white p-2"><Icons.X className="w-8 h-8"/></button>
                            <div className="relative max-w-2xl w-full bg-white p-4 rounded-xl shadow-2xl transform transition-all scale-100" onClick={e=>e.stopPropagation()}>
                                <div className="aspect-auto overflow-hidden rounded-lg bg-stone-100">
                                    <img src={selectedQImage.src} alt={selectedQImage.title} className="w-full h-auto object-contain max-h-[80vh]"/>
                                </div>
                                <div className="mt-4 text-center">
                                    <h3 className="text-2xl font-handwriting text-stone-800">{selectedQImage.title}</h3>
                                    <p className="text-stone-500 mt-2">{selectedQImage.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
